<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Exam</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #timer {
            background: black;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 20px;
        }

        #timer.warning {
            background: red;
        }

        #question {
            font-size: 22px;
            margin: 25px 0;
        }

        .option {
            display: block;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        .option:hover {
            background: #eee;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #previous {
            background: gray;
            color: white;
        }

        #next {
            background: blue;
            color: white;
        }

        #submit {
            background: green;
            color: white;
        }

        #result {
            display: none;
            text-align: center;
        }

        #restart {
            background: black;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top">

            <h1>Online Exam</h1>

            <div id="timer">
                01:00
            </div>

        </div>

        <hr>

        <h3 id="questionNumber"></h3>

        <div id="question"></div>

        <div id="options"></div>

        <div class="buttons">

            <button id="previous" onclick="previousQuestion()">
                Previous
            </button>

            <button id="next" onclick="nextQuestion()">
                Next
            </button>

            <button id="submit" onclick="submitExam()">
                Submit
            </button>

        </div>


        <div id="result">

            <h2>Exam Completed 🎉</h2>

            <p id="score"></p>

            <p id="percentage"></p>

            <p id="grade"></p>

            <button id="restart" onclick="restartExam()">
                Restart Exam
            </button>

        </div>

    </div>


    <script>

        // QUESTIONS

        let questions = [

            {
                question: "Which language is used for web structure?",
                options: ["HTML", "CSS", "Python", "SQL"],
                answer: "HTML"
            },

            {
                question: "Which language is used for styling?",
                options: ["Python", "HTML", "CSS", "SQL"],
                answer: "CSS"
            },

            {
                question: "Which language makes a webpage interactive?",
                options: ["HTML", "CSS", "JavaScript", "SQL"],
                answer: "JavaScript"
            },

            {
                question: "Which keyword declares a variable?",
                options: ["var", "print", "function", "select"],
                answer: "var"
            },

            {
                question: "Which method prints output in console?",
                options: [
                    "print()",
                    "console.log()",
                    "display()",
                    "output()"
                ],
                answer: "console.log()"
            }

        ];


        // VARIABLES

        let currentQuestion = 0;

        let answers = [];

        let timeLeft = 60;

        let timer;


        // DISPLAY QUESTION

        function displayQuestion() {

            let q = questions[currentQuestion];


            document.getElementById("questionNumber").innerHTML =
                "Question " +
                (currentQuestion + 1) +
                " / " +
                questions.length;


            document.getElementById("question").innerHTML =
                q.question;


            let html = "";


            for (let option of q.options) {

                let checked = "";

                if (answers[currentQuestion] === option) {
                    checked = "checked";
                }


                html += `
                    <label class="option">

                        <input
                            type="radio"
                            name="answer"
                            value="${option}"
                            ${checked}
                        >

                        ${option}

                    </label>
                `;
            }


            document.getElementById("options").innerHTML = html;


            document.getElementById("previous").disabled =
                currentQuestion === 0;


            document.getElementById("next").disabled =
                currentQuestion === questions.length - 1;

        }


        // SAVE CURRENT ANSWER

        function saveCurrentAnswer() {

            let selected =
                document.querySelector(
                    'input[name="answer"]:checked'
                );


            if (selected) {

                answers[currentQuestion] =
                    selected.value;

            }

        }


        // NEXT

        function nextQuestion() {

            saveCurrentAnswer();


            if (currentQuestion < questions.length - 1) {

                currentQuestion++;

                displayQuestion();

            }

        }


        // PREVIOUS

        function previousQuestion() {

            saveCurrentAnswer();


            if (currentQuestion > 0) {

                currentQuestion--;

                displayQuestion();

            }

        }


        // SUBMIT

        function submitExam() {

            saveCurrentAnswer();


            clearInterval(timer);


            let score = 0;


            for (let i = 0; i < questions.length; i++) {

                if (answers[i] === questions[i].answer) {

                    score++;

                }

            }


            let percentage =
                (score / questions.length) * 100;


            let grade;


            if (percentage >= 90) {

                grade = "A+";

            }
            else if (percentage >= 80) {

                grade = "A";

            }
            else if (percentage >= 70) {

                grade = "B";

            }
            else if (percentage >= 60) {

                grade = "C";

            }
            else if (percentage >= 50) {

                grade = "D";

            }
            else {

                grade = "F";

            }


            document.getElementById("score").innerHTML =
                "Score: " + score + " / " + questions.length;


            document.getElementById("percentage").innerHTML =
                "Percentage: " + percentage + "%";


            document.getElementById("grade").innerHTML =
                "Grade: " + grade;


            document.getElementById("questionNumber").style.display =
                "none";

            document.getElementById("question").style.display =
                "none";

            document.getElementById("options").style.display =
                "none";

            document.querySelector(".buttons").style.display =
                "none";


            document.getElementById("result").style.display =
                "block";

        }


        // TIMER

        function startTimer() {

            timer = setInterval(function () {

                timeLeft--;


                let minutes =
                    Math.floor(timeLeft / 60);


                let seconds =
                    timeLeft % 60;


                let min =
                    String(minutes).padStart(2, "0");


                let sec =
                    String(seconds).padStart(2, "0");


                document.getElementById("timer").innerHTML =
                    min + ":" + sec;


                if (timeLeft <= 10) {

                    document.getElementById("timer")
                        .classList.add("warning");

                }


                if (timeLeft <= 0) {

                    clearInterval(timer);

                    alert("Time is over!");

                    submitExam();

                }

            }, 1000);

        }


        // RESTART

        function restartExam() {

            currentQuestion = 0;

            answers = [];

            timeLeft = 60;


            document.getElementById("questionNumber").style.display =
                "block";

            document.getElementById("question").style.display =
                "block";

            document.getElementById("options").style.display =
                "block";

            document.querySelector(".buttons").style.display =
                "flex";

            document.getElementById("result").style.display =
                "none";


            document.getElementById("timer")
                .classList.remove("warning");


            document.getElementById("timer").innerHTML =
                "01:00";


            displayQuestion();

            startTimer();

        }


        // START

        displayQuestion();
        startTimer();

    </script>

</body>

</html>
